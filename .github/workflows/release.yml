# SPDX-License-Identifier: Apache-2.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: read

# Control steps report independently and aggregate before any irreversible
# publication. A failed fleet gate does not hide build evidence, but it still
# prevents the publish job from starting.
jobs:
  ci-acceptance:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Require this tag push's full CI release evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/tag_release_gate.py

  # The tag-side invocation of the ONE reusable fleet-acceptance workflow
  # (roadmap 8y item 8), identical by construction to the push-side
  # invocation in ci.yml `kernel-hash-footprint`. This also repairs a real
  # drift: the previous inline copy ran without the private fleet token.
  fleet-gate:
    uses: ./.github/workflows/acceptance.yml
    secrets: inherit

  build:
    if: ${{ !cancelled() }}
    needs:
      - ci-acceptance
      - fleet-gate
    name: linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      SEAL_CI_READ_TOKEN: ${{ secrets.SEAL_CI_READ_TOKEN }}
    steps:
      - id: control_01
        continue-on-error: true
        uses: actions/checkout@v7.0.1
        with: { fetch-depth: 0 }
      # Reserved id control_90: this step is provisioning, not a product
      # control, so it sits out of the per-job numbering. It still reports
      # like every other step -- test/test_ci_control_reporting.py requires
      # every step in a job to be an isolated control that the final
      # aggregate converts back into a job failure.
      - id: control_90
        continue-on-error: true
        name: Provision PyYAML for the workflow-inspecting gates
        uses: ./.github/actions/pyyaml
      - id: control_02
        continue-on-error: true
        name: Require an exact release tag and private build access
        run: |
          test "${GITHUB_REF_NAME}" = "v$(sed -n 's/^version = "\([^"]*\)"/\1/p' rust/Cargo.toml | head -1)"
          test -n "$SEAL_CI_READ_TOKEN"
      - id: control_03
        continue-on-error: true
        name: Guard Lean test-driver wiring and configure private dependency auth
        run: |
          python3 scripts/lean_test_driver_gate.py
          git config --global url."https://x-access-token:${SEAL_CI_READ_TOKEN}@github.com/velvetmonkey/".insteadOf "https://github.com/velvetmonkey/"
      - id: control_04
        continue-on-error: true
        uses: leanprover/lean-action@v1.5.0
        with:
          use-github-cache: false
          build: false
          test: false
          lint: false
      - id: control_05
        continue-on-error: true
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with: { toolchain: "1.96.0", cache: false }
      - id: control_06
        continue-on-error: true
        name: Install release tooling
        run: sudo apt-get update && sudo apt-get install -y patchelf
      - id: control_07
        continue-on-error: true
        run: test -d .lake/packages/mcp-seal || lake update
      - id: control_08
        continue-on-error: true
        run: bash .lake/packages/mcp-seal/c/build.sh
      - id: control_19
        continue-on-error: true
        name: Run aggregate Lean tests after native link dependency build
        run: lake test
      - id: control_09
        continue-on-error: true
        run: lake build +Ffi:c.o.export
      - id: control_10
        continue-on-error: true
        run: scripts/build_ffi_so.sh
      - id: control_11
        continue-on-error: true
        run: scripts/build_rust_release.sh
      - id: control_12
        continue-on-error: true
        run: python3 scripts/release_policy_gate.py
      - id: control_13
        continue-on-error: true
        name: Package the complete runtime closure
        run: |
          python3 test/test_runtime_dependency_gate.py -v
          scripts/package_release.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/release"
      - id: control_14
        continue-on-error: true
        timeout-minutes: 10
        name: Build the non-root container image
        # `timeout-minutes` is enforced BY THE RUNNER, so it cannot fire when the
        # runner itself is lost. Observed on v0.1.3, run 31304617294: the
        # linux-x86_64 job reported `completed failure` while this step stayed
        # permanently `in_progress` with a null completion time, 41+ minutes into
        # a 10-minute cap. A step that never finalises is the signature of a
        # reaped runner, not a hanging build. The cap stays, because it is still
        # the right bound for a genuine hang, and an in-process `timeout` goes
        # underneath it, because that one is enforced by this shell rather than by
        # the agent that may be dying.
        #
        # Disk and memory are reported either side because a reap under an image
        # build is most plausibly resource exhaustion, and the aarch64 runner
        # completed this same step in 16 seconds. Without the numbers the next
        # reap is another guess, and we have already spent three on this.
        run: |
          stage="$RUNNER_TEMP/release/seal-host-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
          echo "::group::resources before the image build"
          df -h / "$RUNNER_TEMP" || true
          free -m || true
          du -sh "$stage" || true
          echo "::endgroup::"
          set +e
          timeout --signal=TERM --kill-after=30s 540s \
            docker build -f deploy/container/Dockerfile.release -t "seal-host:${GITHUB_REF_NAME}-${{ matrix.arch }}" "$stage"
          status=$?
          set -e
          echo "::group::resources after the image build"
          df -h / "$RUNNER_TEMP" || true
          echo "::endgroup::"
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::error::docker build exceeded the 540s in-process timeout (exit $status): a genuine build hang, not a runner reap"
          fi
          exit "$status"
      - id: control_16
        continue-on-error: true
        name: Smoke-test the non-root container user
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' "seal-host:${GITHUB_REF_NAME}-${{ matrix.arch }}")" = "65532:65532"
      - id: control_15
        continue-on-error: true
        name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --override-filename seal-host-rust.cdx
          cp seal-host-rust.cdx.json "$RUNNER_TEMP/release/seal-host-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}.cdx.json"
        working-directory: rust
      - id: control_18
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: seal-host-${{ github.ref_name }}-linux-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/release/*.tar.gz
            ${{ runner.temp }}/release/*.cdx.json

      - name: Require every isolated CI step to pass
        if: ${{ always() }}
        env:
          SEAL_CONTROL_STEPS: ${{ toJSON(steps) }}
        run: python3 scripts/ci_control_aggregate.py

  publish:
    needs:
      - ci-acceptance
      - fleet-gate
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    env:
      COSIGN_SHA256_X86_64: c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74
      COSIGN_SHA256_AARCH64: bedac92e8c3729864e13d4a17048007cfafa79d5deca993a43a90ffe018ef2b8
    steps:
      - id: control_01
        continue-on-error: true
        uses: actions/checkout@v7.0.1
      # Reserved id control_90: this step is provisioning, not a product
      # control, so it sits out of the per-job numbering. It still reports
      # like every other step -- test/test_ci_control_reporting.py requires
      # every step in a job to be an isolated control that the final
      # aggregate converts back into a job failure.
      - id: control_90
        continue-on-error: true
        name: Provision PyYAML for the workflow-inspecting gates
        uses: ./.github/actions/pyyaml
      - id: control_02
        continue-on-error: true
        name: Require the promoted moving v1 Action tag
        run: |
          actual=$(git ls-remote https://github.com/velvetmonkey/seal-verify-action.git refs/tags/v1 | awk '{print $1}')
          test "$actual" = "a10e64827e31fa59c92d240fc46f697d53dde88e"
      - id: control_03
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - id: control_04
        continue-on-error: true
        name: Consolidate SHA-256 checksums
        run: |
          cd "$RUNNER_TEMP/release"
          install -m 0755 "$GITHUB_WORKSPACE/scripts/release_provenance.py" release_provenance.py
          payloads=(
            release_provenance.py
            "seal-host-${GITHUB_REF_NAME}-linux-aarch64.cdx.json"
            "seal-host-${GITHUB_REF_NAME}-linux-aarch64.tar.gz"
            "seal-host-${GITHUB_REF_NAME}-linux-x86_64.cdx.json"
            "seal-host-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          )
          for payload in "${payloads[@]}"; do test -f "$payload"; done
          sha256sum "${payloads[@]}" > SHA256SUMS

      - id: control_05
        continue-on-error: true
        name: Install the pinned Sigstore verifier and signer
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
          install-dir: $RUNNER_TEMP/seal-cosign

      - id: control_06
        continue-on-error: true
        name: Verify the installed Sigstore verifier bytes
        env:
          COSIGN_BIN: ${{ runner.temp }}/seal-cosign/cosign
        run: |
          case "$(uname -m)" in
            x86_64) expected="$COSIGN_SHA256_X86_64" ;;
            aarch64) expected="$COSIGN_SHA256_AARCH64" ;;
            *) echo "unsupported cosign runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          test -r "$COSIGN_BIN" && test -x "$COSIGN_BIN" || { echo "cosign resolution failed: $COSIGN_BIN" >&2; exit 1; }
          actual=$(sha256sum "$COSIGN_BIN" | awk '{print $1}')
          test "$actual" = "$expected" || {
            echo "cosign verifier digest mismatch: expected $expected, actual $actual" >&2
            exit 1
          }
          echo "COSIGN_SHA256=$expected" >> "$GITHUB_ENV"

      - id: control_07
        continue-on-error: true
        name: Bind every release payload in an honest provenance statement
        run: |
          python3 scripts/release_provenance.py create \
            --release-dir "$RUNNER_TEMP/release" \
            --release-version "$GITHUB_REF_NAME" \
            --output "$RUNNER_TEMP/release/SEAL-RELEASE-PROVENANCE.json" \
            --signer-identity "${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}" \
            --oidc-issuer "https://token.actions.githubusercontent.com"

      # GitHub artifact attestations are unavailable for this user-owned
      # private repository. Keep the semantic attestation control, but replace
      # the unavailable service with Seal's signed, byte-binding statement.
      # docs/RELEASE-PROVENANCE.md and CLAIMS.md state the weaker exact claim.
      - id: attest
        continue-on-error: true
        name: Sign Seal release provenance with the workflow OIDC identity
        env:
          COSIGN_BIN: ${{ runner.temp }}/seal-cosign/cosign
        run: |
          "$COSIGN_BIN" sign-blob --yes \
            --bundle "$RUNNER_TEMP/release/SEAL-RELEASE-PROVENANCE.sigstore.json" \
            "$RUNNER_TEMP/release/SEAL-RELEASE-PROVENANCE.json"

      - id: control_08
        continue-on-error: true
        name: Refuse publication unless provenance signature and digests verify
        env:
          COSIGN_BIN: ${{ runner.temp }}/seal-cosign/cosign
        run: |
          python3 scripts/release_provenance.py verify \
            --release-dir "$RUNNER_TEMP/release" \
            --release-version "$GITHUB_REF_NAME" \
            --statement "$RUNNER_TEMP/release/SEAL-RELEASE-PROVENANCE.json" \
            --bundle "$RUNNER_TEMP/release/SEAL-RELEASE-PROVENANCE.sigstore.json" \
            --cosign "$COSIGN_BIN" \
            --cosign-sha256 "$COSIGN_SHA256" \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Require every isolated CI step to pass
        if: ${{ always() }}
        env:
          SEAL_CONTROL_STEPS: ${{ toJSON(steps) }}
        run: python3 scripts/ci_control_aggregate.py

      # Publication is an effect, not a control. It runs only after every
      # pre-publication control above and all prerequisite jobs succeeded.
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/release"/* --verify-tag --generate-notes
