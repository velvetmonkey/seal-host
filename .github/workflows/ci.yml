name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SEAL_CI_READ_TOKEN: ${{ secrets.SEAL_CI_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Skip private Lean build without dependency token
        if: ${{ env.SEAL_CI_READ_TOKEN == '' }}
        run: |
          echo "::notice::SEAL_CI_READ_TOKEN is not configured; skipping private Lean build."
      - name: Configure private Lake dependency auth
        if: ${{ env.SEAL_CI_READ_TOKEN != '' }}
        run: |
          git config --global \
            url."https://x-access-token:${SEAL_CI_READ_TOKEN}@github.com/velvetmonkey/".insteadOf \
            "https://github.com/velvetmonkey/"
      - uses: leanprover/lean-action@v1.5.0
        if: ${{ env.SEAL_CI_READ_TOKEN != '' }}
        with:
          use-github-cache: false
          build: false
      - run: test -d .lake/packages/mcp-seal || lake update
        if: ${{ env.SEAL_CI_READ_TOKEN != '' }}
      - run: bash .lake/packages/mcp-seal/c/build.sh
        if: ${{ env.SEAL_CI_READ_TOKEN != '' }}
      - run: lake build
        if: ${{ env.SEAL_CI_READ_TOKEN != '' }}
      - run: lake exe axiom_check 2>&1 | tee /tmp/axioms.txt
        if: ${{ env.SEAL_CI_READ_TOKEN != '' }}
      - run: "! grep -E 'sorryAx|Lean\\.ofReduceBool' /tmp/axioms.txt"
        if: ${{ env.SEAL_CI_READ_TOKEN != '' }}
      - run: lake exe host_unit_tests
        if: ${{ env.SEAL_CI_READ_TOKEN != '' }}
      - run: lake exe dx_surface_tests
        if: ${{ env.SEAL_CI_READ_TOKEN != '' }}

  rust-conformance:
    runs-on: ubuntu-latest
    env:
      SEAL_CI_READ_TOKEN: ${{ secrets.SEAL_CI_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Skip private conformance without dependency token
        if: ${{ env.SEAL_CI_READ_TOKEN == '' }}
        run: |
          echo "::notice::SEAL_CI_READ_TOKEN is not configured; skipping private Lean/Rust conformance."
      - name: Configure private Lake dependency auth
        if: ${{ env.SEAL_CI_READ_TOKEN != '' }}
        run: |
          git config --global \
            url."https://x-access-token:${SEAL_CI_READ_TOKEN}@github.com/velvetmonkey/".insteadOf \
            "https://github.com/velvetmonkey/"
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        if: ${{ env.SEAL_CI_READ_TOKEN != '' }}
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
          cache: false
      - run: cargo fmt --check
        if: ${{ env.SEAL_CI_READ_TOKEN != '' }}
        working-directory: rust
      - uses: leanprover/lean-action@v1.5.0
        if: ${{ env.SEAL_CI_READ_TOKEN != '' }}
        with:
          use-github-cache: false
          build: false
      - uses: actions/setup-node@v6.4.0
        if: ${{ env.SEAL_CI_READ_TOKEN != '' }}
        with:
          node-version: "22"
      - name: Verify tracked wasm conformance artifact is present
        if: ${{ env.SEAL_CI_READ_TOKEN != '' }}
        run: test -s wasm-spike/verified/seal.js && test -s wasm-spike/verified/seal.wasm
      - run: test -d .lake/packages/mcp-seal || lake update
        if: ${{ env.SEAL_CI_READ_TOKEN != '' }}
      - run: bash .lake/packages/mcp-seal/c/build.sh
        if: ${{ env.SEAL_CI_READ_TOKEN != '' }}
      - run: lake build +Ffi:c.o.export
        if: ${{ env.SEAL_CI_READ_TOKEN != '' }}
      - run: scripts/build_ffi_so.sh
        if: ${{ env.SEAL_CI_READ_TOKEN != '' }}
      - run: cargo clippy --all-targets -- -D warnings
        if: ${{ env.SEAL_CI_READ_TOKEN != '' }}
        working-directory: rust
      # --no-fail-fast: a test binary that dies on a signal instead of
      # reporting otherwise takes every binary queued behind it down with it,
      # and cargo exits non-zero having silently run a fraction of the suite
      # (observed: 44 of 60 reported). The libunwind/libgcc DT_NEEDED tie that
      # caused it is fixed in build.rs; this is the belt to its braces, so a
      # partial run can never again be mistaken for a whole one.
      - run: cargo test --no-fail-fast
        if: ${{ env.SEAL_CI_READ_TOKEN != '' }}
        working-directory: rust
      - run: cargo build --release --bins
        if: ${{ env.SEAL_CI_READ_TOKEN != '' }}
        working-directory: rust
      - run: lake build
        if: ${{ env.SEAL_CI_READ_TOKEN != '' }}
      - run: lake exe honesty_matrix > /tmp/honesty.json
        if: ${{ env.SEAL_CI_READ_TOKEN != '' }}
      - run: node scripts/honesty-matrix.mjs --check /tmp/honesty.json
        if: ${{ env.SEAL_CI_READ_TOKEN != '' }}
      - run: node scripts/conformance_bridge.mjs --wasm
        if: ${{ env.SEAL_CI_READ_TOKEN != '' }}
      - name: Exercise deployed production startup and record emission
        if: ${{ env.SEAL_CI_READ_TOKEN != '' }}
        run: node scripts/production_startup_conformance.mjs
      # Three-way differential at CI volume: native .so ≡ pinned seal.wasm ≡
      # interpreted Lean model, byte-for-byte per step input (the default-256
      # smoke already ran inside `cargo test` above). 25000 fuzz cases + the
      # curated families ≈ 30 s wall measured locally. This is differential
      # EVIDENCE over the cases tried — never a universal binary≡model claim
      # (Lane C stays a trusted compile). Soak knobs: rust/tests/three_way.rs.
      - run: SEAL_THREE_WAY_CASES=25000 cargo test --test three_way three_way_agreement -- --nocapture
        if: ${{ env.SEAL_CI_READ_TOKEN != '' }}
        working-directory: rust
      - run: bash scripts/receipt_demo.sh
        if: ${{ env.SEAL_CI_READ_TOKEN != '' }}
      # V2.3 byte-twin guard, named so nobody has to trust that the generic
      # `cargo test` above covered it: the Rust encoder must reproduce the
      # Lean-spec-generated expectation over the shared corpus
      # (rust/tests/vectors/envelope_v23_twin_corpus.json), and the corpus
      # golden line must equal the #guard_msgs literal frozen in
      # mcp-seal-dev's SealV2/EffectEnvelope.lean. The live dual-encoder diff
      # in the same file stays #[ignore]d until the mcp-seal pin carries
      # SealV2.EffectEnvelope (mcp-seal-dev 9452f32 or later).
      - run: cargo test --test envelope_v23_twin
        if: ${{ env.SEAL_CI_READ_TOKEN != '' }}
        working-directory: rust

  # Runs on EVERY push and pull request, with no dependency token and no
  # Lean/cargo toolchain: the `cargo test --test envelope_v23_twin` step above
  # is skipped whenever SEAL_CI_READ_TOKEN is unset, so this job is the only
  # freeze enforcement on the tokenless path. It hashes the checked-in V2.3
  # contract surface against an independent review baseline and
  # docs/effect-envelope-v23.freeze.json, enumerates tracked vector files, and
  # cross-checks the golden #guard_msgs literals without compiling anything.
  contract-freeze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Explicit belt-and-braces signal: --refreeze is never legitimate here.
      CONTRACT_FREEZE_CI: "1"
    steps:
      - uses: actions/checkout@v6.0.3
      - name: V2.3 contract must match its review baseline and freeze manifest
        run: python3 scripts/contract_freeze_gate.py
      - name: Freeze gate fail-closed self-tests
        run: python3 -m unittest discover -s test -p 'test_contract_freeze_gate.py' -v

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.96.0"
          cache: false
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings
        working-directory: rust

  rust-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: "1.96.0"
          cache: false
      - run: cargo install cargo-cyclonedx --locked
      - name: Generate CycloneDX SBOM
        run: |
          cargo cyclonedx --format json --override-filename seal-host-rust.cdx
          mkdir -p target/sbom
          mv seal-host-rust.cdx.json target/sbom/seal-host-rust.cdx.json
        working-directory: rust
      - uses: actions/upload-artifact@v4
        with:
          name: seal-host-rust-sbom
          path: rust/target/sbom/seal-host-rust.cdx.json
