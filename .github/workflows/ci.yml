# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: leanprover/lean-action@v1.5.0
        with:
          use-github-cache: false
          build: false
      - run: test -d .lake/packages/mcp-seal || lake update
      - run: bash .lake/packages/mcp-seal/c/build.sh
      - run: lake build
      - run: lake exe axiom_check 2>&1 | tee /tmp/axioms.txt
      - run: "! grep -E 'sorryAx|Lean\\.ofReduceBool' /tmp/axioms.txt"

  rust-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
          cache: false
      - run: cargo fmt --check
        working-directory: rust
      - uses: leanprover/lean-action@v1.5.0
        with:
          use-github-cache: false
          build: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
      - name: Verify tracked wasm conformance artifact is present
        run: test -s wasm-spike/verified/seal.js && test -s wasm-spike/verified/seal.wasm
      - run: test -d .lake/packages/mcp-seal || lake update
      - run: bash .lake/packages/mcp-seal/c/build.sh
      - run: lake build Ffi
      - run: scripts/build_ffi_so.sh
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: rust
      - run: cargo test
        working-directory: rust
      - run: cargo build --release --bins
        working-directory: rust
      - run: lake build
      - run: node scripts/conformance_bridge.mjs --wasm
      - run: bash scripts/receipt_demo.sh

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          toolchain: "1.96.0"
          cache: false
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny-warnings
        working-directory: rust

  rust-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          toolchain: "1.96.0"
          cache: false
      - run: cargo install cargo-cyclonedx --locked
      - name: Generate CycloneDX SBOM
        run: mkdir -p target/sbom && cargo cyclonedx --format json --override-filename target/sbom/seal-host-rust.cdx.json
        working-directory: rust
      - uses: actions/upload-artifact@v4
        with:
          name: seal-host-rust-sbom
          path: rust/target/sbom/seal-host-rust.cdx.json
