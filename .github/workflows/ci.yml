# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: leanprover/lean-action@v1.5.0
        with:
          use-github-cache: false
          build: false
      - run: lake build
      - run: lake exe axiom_check 2>&1 | tee /tmp/axioms.txt
      - run: "! grep -E 'sorryAx|Lean\\.ofReduceBool' /tmp/axioms.txt"

  rust-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
          cache: false
      - run: cargo fmt --check
        working-directory: rust
      - uses: leanprover/lean-action@v1.5.0
        with:
          use-github-cache: false
          build: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
      - run: lake build Ffi
      - run: scripts/build_ffi_so.sh
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: rust
      - run: cargo test
        working-directory: rust
      - run: cargo build --release --bins
        working-directory: rust
      - run: lake build
      - run: node scripts/conformance_bridge.mjs
      - run: bash scripts/receipt_demo.sh
