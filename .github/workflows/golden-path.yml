name: Golden Path - deterministic shell + Postgres + filesystem

on:
  push:

jobs:
  deterministic-shell:
    runs-on: ubuntu-latest
    env:
      SEAL_CI_READ_TOKEN: ${{ secrets.SEAL_CI_READ_TOKEN }}
      SEAL_GOLDEN_PATH_IMAGE: node@sha256:813a7480f28fdadac1f7f5c824bcdad435b5bc1322a5968bbbdef8d058f9dff4
      SEAL_FILESYSTEM_IMAGE: node@sha256:813a7480f28fdadac1f7f5c824bcdad435b5bc1322a5968bbbdef8d058f9dff4
      SEAL_POSTGRES_IMAGE: postgres@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
      SEAL_ASSURANCE_KIT_ROOT: ${{ github.workspace }}/seal-assurance-kit
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Require private dependency access
        run: |
          test -n "$SEAL_CI_READ_TOKEN" || {
            echo "::error::SEAL_CI_READ_TOKEN is required; deterministic acceptance was not run."
            exit 1
          }

      # This ref MUST move with the kernel. The kit checked out here IS the
      # verifier the acceptance run checks receipts with, so a stale ref
      # verifies today's receipts against yesterday's kernel and fails
      # "kernel binary matches receipt". It is a commit SHA, so a `grep df42`
      # re-pin sweep cannot see it — when the kernel sha changes, bump it here
      # by hand. 6d0d6eb carries kernel d3067bc0 (0db03ef carried df42).
      - name: Check out pinned assurance kit
        uses: actions/checkout@v6.0.3
        with:
          repository: velvetmonkey/seal-assurance-kit
          ref: 6d0d6eb1512983ed9a1d09146476f806dd89d828
          token: ${{ secrets.SEAL_CI_READ_TOKEN }}
          path: seal-assurance-kit

      - name: Configure private Lake dependency auth
        run: |
          git config --global \
            url."https://x-access-token:${SEAL_CI_READ_TOKEN}@github.com/velvetmonkey/".insteadOf \
            "https://github.com/velvetmonkey/"

      - uses: leanprover/lean-action@v1.5.0
        with:
          use-github-cache: false
          build: false

      - uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          toolchain: "1.96.0"
          cache: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"

      - name: Stage pinned container image
        run: docker pull "$SEAL_GOLDEN_PATH_IMAGE"

      - name: Stage pinned Postgres image
        run: docker pull "$SEAL_POSTGRES_IMAGE"

      - name: Deterministic shell acceptance (no model, no operator auth)
        run: |
          python3 demo/golden_path.py shell --deterministic | tee /tmp/golden-path.txt
          grep -F "policy tamper fail-closed" /tmp/golden-path.txt
          grep -F "approval tamper fail-closed" /tmp/golden-path.txt
          grep -F "downstream non-receipt" /tmp/golden-path.txt
          grep -F "receipt verify + tier" /tmp/golden-path.txt
          grep -F "local deterministic-tested, ci_tested=false, operator_verified=false" /tmp/golden-path.txt
          grep -F "dev-box deterministic-tested (local run); CI configured but not run; operator-verified: NO" /tmp/golden-path.txt
          grep -F "operator-untested until run by Ben" /tmp/golden-path.txt

      - name: Deterministic Postgres S+B+T acceptance (no model, no operator auth)
        run: |
          python3 demo/golden_path.py postgres --deterministic | tee /tmp/golden-path-postgres.txt
          grep -F "containment preflight" /tmp/golden-path-postgres.txt
          grep -F "prod-db review + signed policy" /tmp/golden-path-postgres.txt
          grep -F "policy tamper fail-closed" /tmp/golden-path-postgres.txt
          grep -F "approval tamper fail-closed" /tmp/golden-path-postgres.txt
          grep -F "approved one-shot real DROP" /tmp/golden-path-postgres.txt
          grep -F "accumulated Budget cap" /tmp/golden-path-postgres.txt
          grep -F "Budget stateful evidence" /tmp/golden-path-postgres.txt
          grep -F "Temporal freeze" /tmp/golden-path-postgres.txt
          grep -F "Temporal stateful evidence" /tmp/golden-path-postgres.txt
          grep -F "fresh receipt verification" /tmp/golden-path-postgres.txt
          grep -F "seal scan composition" /tmp/golden-path-postgres.txt
          grep -F "Budget/Temporal enforcement is machine-checked" /tmp/golden-path-postgres.txt
          grep -F "receipt not called independently verified" /tmp/golden-path-postgres.txt
          grep -F "dev-box deterministic-tested (local run); CI configured but not run; operator-verified: NO" /tmp/golden-path-postgres.txt
          grep -F "operator-untested until run by Ben" /tmp/golden-path-postgres.txt

      - name: Deterministic filesystem S+B acceptance (no model, no operator auth)
        run: |
          python3 demo/golden_path.py filesystem --deterministic | tee /tmp/golden-path-filesystem.txt
          grep -F "containment preflight" /tmp/golden-path-filesystem.txt
          grep -F "only /workspace writable" /tmp/golden-path-filesystem.txt
          grep -F "init + add-kernel B policy" /tmp/golden-path-filesystem.txt
          grep -F "ACTIVE {S,B}" /tmp/golden-path-filesystem.txt
          grep -F "benign read flows" /tmp/golden-path-filesystem.txt
          grep -F "policy tamper fail-closed" /tmp/golden-path-filesystem.txt
          grep -F "approval tamper fail-closed" /tmp/golden-path-filesystem.txt
          grep -F "path escape rejection" /tmp/golden-path-filesystem.txt
          grep -F "PATH_REJECTED both before filesystem access" /tmp/golden-path-filesystem.txt
          grep -F "approved one-shot real write" /tmp/golden-path-filesystem.txt
          grep -F "replayed_nonce BLOCK" /tmp/golden-path-filesystem.txt
          grep -F "accumulated Budget cap" /tmp/golden-path-filesystem.txt
          grep -F "Budget stateful evidence" /tmp/golden-path-filesystem.txt
          grep -F "fresh write receipt verification" /tmp/golden-path-filesystem.txt
          grep -F "seal scan composition" /tmp/golden-path-filesystem.txt
          grep -F "Budget enforcement is machine-checked by composed_budget_cap" /tmp/golden-path-filesystem.txt
          grep -F "receipt not called independently verified" /tmp/golden-path-filesystem.txt
          grep -F "dev-box deterministic-tested (local run); CI configured but not run; operator-verified: NO" /tmp/golden-path-filesystem.txt
          grep -F "operator-untested until run by Ben" /tmp/golden-path-filesystem.txt
