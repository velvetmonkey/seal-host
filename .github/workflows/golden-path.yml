name: Golden Path - deterministic shell + Postgres + token governor + filesystem

on:
  push:

jobs:
  deterministic-shell:
    runs-on: ubuntu-latest
    env:
      SEAL_CI_READ_TOKEN: ${{ secrets.SEAL_CI_READ_TOKEN }}
      SEAL_GOLDEN_PATH_IMAGE: node@sha256:813a7480f28fdadac1f7f5c824bcdad435b5bc1322a5968bbbdef8d058f9dff4
      SEAL_FILESYSTEM_IMAGE: node@sha256:813a7480f28fdadac1f7f5c824bcdad435b5bc1322a5968bbbdef8d058f9dff4
      SEAL_POSTGRES_IMAGE: postgres@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
      SEAL_ASSURANCE_KIT_ROOT: ${{ github.workspace }}/seal-assurance-kit
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Proven Lean surface is read-only in this push
        run: |
          PUSH_BASE="${{ github.event.before }}"
          if ! git cat-file -e "$PUSH_BASE^{commit}" 2>/dev/null; then
            PUSH_BASE="$(git merge-base origin/main HEAD)"
          fi
          git diff --exit-code "$PUSH_BASE" "${{ github.sha }}" -- '*.lean'

      - name: Require private dependency access
        run: |
          test -n "$SEAL_CI_READ_TOKEN" || {
            echo "::error::SEAL_CI_READ_TOKEN is required; deterministic acceptance was not run."
            exit 1
          }

      # This ref MUST move with the kernel. The kit checked out here IS the
      # verifier the acceptance run checks receipts with, so a stale ref
      # verifies today's receipts against yesterday's kernel and fails
      # "kernel binary matches receipt". It is a commit SHA, so a `grep df42`
      # re-pin sweep cannot see it — when the kernel sha changes, bump it here
      # by hand. 62f5fe5 carries kernel a3790181 plus the current 7-kernel
      # policy bundle (f95ac81 carried the same kernel before that merge).
      - name: Check out pinned assurance kit
        uses: actions/checkout@v6.0.3
        with:
          repository: velvetmonkey/seal-assurance-kit
          ref: 62f5fe5d2f3f9d1d700b524aa1d415db449799fc
          token: ${{ secrets.SEAL_CI_READ_TOKEN }}
          path: seal-assurance-kit

      - name: Configure private Lake dependency auth
        run: |
          git config --global \
            url."https://x-access-token:${SEAL_CI_READ_TOKEN}@github.com/velvetmonkey/".insteadOf \
            "https://github.com/velvetmonkey/"

      - uses: leanprover/lean-action@v1.5.0
        with:
          use-github-cache: false
          build: false

      - uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          toolchain: "1.96.0"
          cache: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"

      - name: Stage pinned container image
        run: docker pull "$SEAL_GOLDEN_PATH_IMAGE"

      - name: Stage pinned Postgres image
        run: docker pull "$SEAL_POSTGRES_IMAGE"

      - name: Doctrine spine unit checks
        run: python3 -m unittest discover -s demo/tests -v

      - name: Deterministic shell acceptance (no model, no operator auth)
        run: |
          C1_ARTIFACT="$RUNNER_TEMP/seal-doctrine-c1"
          ./demo/run c1 --output-dir "$C1_ARTIFACT" --color always | tee "$RUNNER_TEMP/golden-path-c1.txt"
          python3 demo/doctrine_check.py "$C1_ARTIFACT"
          python3 demo/render_trace.py "$C1_ARTIFACT/events.ndjson" \
            --format markdown --output "$C1_ARTIFACT/receipt-strip.regenerated.md"
          cmp "$C1_ARTIFACT/receipt-strip.md" "$C1_ARTIFACT/receipt-strip.regenerated.md"
          grep -F "ANTI-FORGE rejected exit=" "$RUNNER_TEMP/golden-path-c1.txt"
          grep -F "restore-byte-exact=true" "$RUNNER_TEMP/golden-path-c1.txt"
          grep -F "PASS doctrine trace" "$RUNNER_TEMP/golden-path-c1.txt"

      - name: Deterministic Postgres S+B+T acceptance (no model, no operator auth)
        run: |
          C2_ARTIFACT="$RUNNER_TEMP/seal-doctrine-c2"
          ./demo/run c2 --output-dir "$C2_ARTIFACT" --color always | tee "$RUNNER_TEMP/golden-path-c2.txt"
          python3 demo/doctrine_check.py "$C2_ARTIFACT"
          python3 demo/render_trace.py "$C2_ARTIFACT/events.ndjson" \
            --format markdown --output "$C2_ARTIFACT/receipt-strip.regenerated.md"
          cmp "$C2_ARTIFACT/receipt-strip.md" "$C2_ARTIFACT/receipt-strip.regenerated.md"
          grep -F "real costArg Budget control" "$RUNNER_TEMP/golden-path-c2.txt"
          grep -F "costArg type fail-closed" "$RUNNER_TEMP/golden-path-c2.txt"
          grep -F "ANTI-FORGE rejected exit=" "$RUNNER_TEMP/golden-path-c2.txt"
          grep -F "restore-byte-exact=true" "$RUNNER_TEMP/golden-path-c2.txt"
          grep -F "PASS doctrine trace" "$RUNNER_TEMP/golden-path-c2.txt"

      - name: Deterministic token-governor S+B acceptance (no model, no operator auth)
        run: |
          C4_ARTIFACT="$RUNNER_TEMP/seal-doctrine-c4"
          ./demo/run c4 --output-dir "$C4_ARTIFACT" --color always | tee "$RUNNER_TEMP/golden-path-c4.txt"
          python3 demo/doctrine_check.py "$C4_ARTIFACT"
          python3 demo/render_trace.py "$C4_ARTIFACT/events.ndjson" \
            --format markdown --output "$C4_ARTIFACT/receipt-strip.regenerated.md"
          cmp "$C4_ARTIFACT/receipt-strip.md" "$C4_ARTIFACT/receipt-strip.regenerated.md"
          python3 - "$RUNNER_TEMP/golden-path-c4.txt" <<'PY'
          import sys
          text = open(sys.argv[1], encoding="utf-8").read()
          start = text.find("\x1b[")
          assert start >= 0, "C4 output has no coloured line"
          assert text[start:].startswith("\x1b[31;1mDENY\x1b[0m ATTACK-DENY"), text[start:start + 80]
          PY
          grep -F "deny_kernel=budget" "$RUNNER_TEMP/golden-path-c4.txt"
          grep -F "budget=token-usage costArg=usage.tokens cost=11 cap=10 remaining=10→would-exceed (unchanged=10)" "$RUNNER_TEMP/golden-path-c4.txt"
          grep -F "budget=token-usage costArg=usage.tokens cost=4 cap=10 remaining=10→6" "$RUNNER_TEMP/golden-path-c4.txt"
          grep -F "same llm_call prompt; usage.tokens=4 ALLOW; remaining 10->6; exactly one downstream execution" "$RUNNER_TEMP/golden-path-c4.txt"
          grep -F "ANTI-FORGE rejected exit=" "$RUNNER_TEMP/golden-path-c4.txt"
          grep -F "restore-byte-exact=true" "$RUNNER_TEMP/golden-path-c4.txt"
          grep -F "PASS doctrine trace" "$RUNNER_TEMP/golden-path-c4.txt"

      - name: Deterministic filesystem S+B acceptance (no model, no operator auth)
        run: |
          python3 demo/golden_path.py filesystem --deterministic | tee /tmp/golden-path-filesystem.txt
          grep -F "containment preflight" /tmp/golden-path-filesystem.txt
          grep -F "only /workspace writable" /tmp/golden-path-filesystem.txt
          grep -F "init + add-kernel B policy" /tmp/golden-path-filesystem.txt
          grep -F "ACTIVE {S,B}" /tmp/golden-path-filesystem.txt
          grep -F "benign read flows" /tmp/golden-path-filesystem.txt
          grep -F "policy tamper fail-closed" /tmp/golden-path-filesystem.txt
          grep -F "approval tamper fail-closed" /tmp/golden-path-filesystem.txt
          grep -F "path escape rejection" /tmp/golden-path-filesystem.txt
          grep -F "PATH_REJECTED both before filesystem access" /tmp/golden-path-filesystem.txt
          grep -F "approved one-shot real write" /tmp/golden-path-filesystem.txt
          grep -F "replayed_nonce BLOCK" /tmp/golden-path-filesystem.txt
          grep -F "accumulated Budget cap" /tmp/golden-path-filesystem.txt
          grep -F "Budget stateful evidence" /tmp/golden-path-filesystem.txt
          grep -F "fresh write receipt verification" /tmp/golden-path-filesystem.txt
          grep -F "seal scan composition" /tmp/golden-path-filesystem.txt
          grep -F "Budget enforcement is machine-checked by composed_budget_cap" /tmp/golden-path-filesystem.txt
          grep -F "receipt not called independently verified" /tmp/golden-path-filesystem.txt
          grep -F "dev-box deterministic-tested (local run); CI configured but not run; operator-verified: NO" /tmp/golden-path-filesystem.txt
          grep -F "operator-untested until run by Ben" /tmp/golden-path-filesystem.txt

      - name: Preserve doctrine traces, manifests, receipts, and renderings (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctrine-c1-c2-c4-${{ github.sha }}
          path: |
            ${{ runner.temp }}/seal-doctrine-c1
            ${{ runner.temp }}/seal-doctrine-c2
            ${{ runner.temp }}/seal-doctrine-c4
