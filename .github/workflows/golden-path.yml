# SPDX-License-Identifier: Apache-2.0

name: Golden Path - deterministic shell + Postgres + deploy + token governor + temporal freeze + filesystem

on:
  push:

jobs:
  deterministic-shell:
    runs-on: ubuntu-latest
    env:
      SEAL_CI_READ_TOKEN: ${{ secrets.SEAL_CI_READ_TOKEN }}
      SEAL_GOLDEN_PATH_IMAGE: node@sha256:813a7480f28fdadac1f7f5c824bcdad435b5bc1322a5968bbbdef8d058f9dff4
      SEAL_FILESYSTEM_IMAGE: node@sha256:813a7480f28fdadac1f7f5c824bcdad435b5bc1322a5968bbbdef8d058f9dff4
      SEAL_POSTGRES_IMAGE: postgres@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
      SEAL_ASSURANCE_KIT_ROOT: ${{ github.workspace }}/seal-assurance-kit
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Require private dependency access
        run: |
          test -n "$SEAL_CI_READ_TOKEN" || {
            echo "::error::SEAL_CI_READ_TOKEN is required; deterministic acceptance was not run."
            exit 1
          }

      # This ref MUST move with the kernel. The kit checked out here IS the
      # verifier the acceptance run checks receipts with, so a stale ref
      # verifies today's receipts against yesterday's kernel and fails
      # "kernel binary matches receipt". It is a commit SHA, so a `grep df42`
      # re-pin sweep cannot see it — when the kernel sha changes, bump it here
      # by hand. 62f5fe5 carries kernel a3790181 plus the current 7-kernel
      # policy bundle (f95ac81 carried the same kernel before that merge).
      - name: Check out pinned assurance kit
        uses: actions/checkout@v6.0.3
        with:
          repository: velvetmonkey/seal-assurance-kit
          ref: 62f5fe5d2f3f9d1d700b524aa1d415db449799fc
          token: ${{ secrets.SEAL_CI_READ_TOKEN }}
          path: seal-assurance-kit

      - name: Configure private Lake dependency auth
        run: |
          git config --global \
            url."https://x-access-token:${SEAL_CI_READ_TOKEN}@github.com/velvetmonkey/".insteadOf \
            "https://github.com/velvetmonkey/"

      - uses: leanprover/lean-action@v1.5.0
        with:
          use-github-cache: false
          build: false

      - name: Changed proven Lean surface must re-prove axiom-clean
        run: |
          PUSH_BASE="${{ github.event.before }}"
          if ! git cat-file -e "$PUSH_BASE^{commit}" 2>/dev/null; then
            PUSH_BASE="$(git merge-base origin/main HEAD)"
          fi
          if git diff --quiet "$PUSH_BASE" "${{ github.sha }}" -- '*.lean'; then
            echo "No Lean changes in this push; proof gate not needed."
            exit 0
          fi
          echo "Lean surface changed; rebuilding and enforcing the axiom-clean proof gates."
          lake exe cache get
          bash .lake/packages/mcp-seal/c/build.sh
          lake build
          lake exe axiom_check 2>&1 | tee "$RUNNER_TEMP/axioms.txt"
          ! grep -E 'sorryAx|Lean\.ofReduceBool' "$RUNNER_TEMP/axioms.txt"
          lake exe host_unit_tests
          lake exe dx_surface_tests

      - uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
        with:
          toolchain: "1.96.0"
          cache: false

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"

      - name: Stage pinned container image
        run: docker pull "$SEAL_GOLDEN_PATH_IMAGE"

      - name: Stage pinned Postgres image
        run: docker pull "$SEAL_POSTGRES_IMAGE"

      - name: Doctrine spine unit checks
        run: python3 -m unittest discover -s demo/tests -v

      - name: Deterministic shell acceptance (no model, no operator auth)
        run: |
          C1_ARTIFACT="$RUNNER_TEMP/seal-doctrine-c1"
          ./demo/run c1 --output-dir "$C1_ARTIFACT" --color always | tee "$RUNNER_TEMP/golden-path-c1.txt"
          python3 demo/doctrine_check.py "$C1_ARTIFACT"
          python3 demo/render_trace.py "$C1_ARTIFACT/events.ndjson" \
            --format markdown --output "$C1_ARTIFACT/receipt-strip.regenerated.md"
          cmp "$C1_ARTIFACT/receipt-strip.md" "$C1_ARTIFACT/receipt-strip.regenerated.md"
          grep -F "ANTI-FORGE rejected exit=" "$RUNNER_TEMP/golden-path-c1.txt"
          grep -F "restore-byte-exact=true" "$RUNNER_TEMP/golden-path-c1.txt"
          grep -F "PASS doctrine trace" "$RUNNER_TEMP/golden-path-c1.txt"

      # Runs after C1 because golden_path.py's named-target build is what
      # produces rust/target/debug/seal-host-rs on the runner.
      - name: Policy schema anti-drift gate (codec single source)
        run: ./scripts/policy_schema_gate.sh

      - name: Deterministic Postgres S+B+T acceptance (no model, no operator auth)
        run: |
          C2_ARTIFACT="$RUNNER_TEMP/seal-doctrine-c2"
          ./demo/run c2 --output-dir "$C2_ARTIFACT" --color always | tee "$RUNNER_TEMP/golden-path-c2.txt"
          python3 demo/doctrine_check.py "$C2_ARTIFACT"
          python3 demo/render_trace.py "$C2_ARTIFACT/events.ndjson" \
            --format markdown --output "$C2_ARTIFACT/receipt-strip.regenerated.md"
          cmp "$C2_ARTIFACT/receipt-strip.md" "$C2_ARTIFACT/receipt-strip.regenerated.md"
          grep -F "real costArg Budget control" "$RUNNER_TEMP/golden-path-c2.txt"
          grep -F "costArg type fail-closed" "$RUNNER_TEMP/golden-path-c2.txt"
          grep -F "ANTI-FORGE rejected exit=" "$RUNNER_TEMP/golden-path-c2.txt"
          grep -F "restore-byte-exact=true" "$RUNNER_TEMP/golden-path-c2.txt"
          grep -F "PASS doctrine trace" "$RUNNER_TEMP/golden-path-c2.txt"

      - name: Deterministic token-governor S+B acceptance (no model, no operator auth)
        run: |
          C4_ARTIFACT="$RUNNER_TEMP/seal-doctrine-c4"
          ./demo/run c4 --output-dir "$C4_ARTIFACT" --color always | tee "$RUNNER_TEMP/golden-path-c4.txt"
          python3 demo/doctrine_check.py "$C4_ARTIFACT"
          python3 demo/render_trace.py "$C4_ARTIFACT/events.ndjson" \
            --format markdown --output "$C4_ARTIFACT/receipt-strip.regenerated.md"
          cmp "$C4_ARTIFACT/receipt-strip.md" "$C4_ARTIFACT/receipt-strip.regenerated.md"
          python3 - "$RUNNER_TEMP/golden-path-c4.txt" <<'PY'
          import sys
          lines = [line for line in open(sys.argv[1], encoding="utf-8")
                   if line.startswith(("\x1b[31;1mDENY\x1b[0m", "\x1b[32;1mALLOW\x1b[0m"))]
          assert len(lines) == 2, lines
          assert lines[0].startswith("\x1b[31;1mDENY\x1b[0m ATTACK-DENY  llm_call"), lines[0]
          assert lines[1].startswith("\x1b[32;1mALLOW\x1b[0m LEGIT  llm_call"), lines[1]
          PY
          grep -F "deny_kernel=budget" "$RUNNER_TEMP/golden-path-c4.txt"
          grep -F "budget=token-usage costArg=usage.tokens cost=11 cap=10 remaining=10→would-exceed (unchanged=10)" "$RUNNER_TEMP/golden-path-c4.txt"
          grep -F "budget=token-usage costArg=usage.tokens cost=4 cap=10 remaining=10→6" "$RUNNER_TEMP/golden-path-c4.txt"
          grep -F "same llm_call prompt; usage.tokens=4 ALLOW; remaining 10->6; exactly one downstream execution" "$RUNNER_TEMP/golden-path-c4.txt"
          grep -F "ANTI-FORGE rejected exit=" "$RUNNER_TEMP/golden-path-c4.txt"
          grep -F "restore-byte-exact=true" "$RUNNER_TEMP/golden-path-c4.txt"
          grep -F "PASS doctrine trace" "$RUNNER_TEMP/golden-path-c4.txt"

      - name: Deterministic deploy S+C+L acceptance (no model, no operator auth)
        run: |
          C3_ARTIFACT="$RUNNER_TEMP/seal-doctrine-c3"
          ./demo/run c3 --output-dir "$C3_ARTIFACT" --color always | tee "$RUNNER_TEMP/golden-path-c3.txt"
          python3 demo/doctrine_check.py "$C3_ARTIFACT"
          python3 demo/render_trace.py "$C3_ARTIFACT/events.ndjson" \
            --format markdown --output "$C3_ARTIFACT/receipt-strip.regenerated.md"
          cmp "$C3_ARTIFACT/receipt-strip.md" "$C3_ARTIFACT/receipt-strip.regenerated.md"
          node demo/trace_replay.cjs "$C3_ARTIFACT/trace-transcript.json" \
            --kit "$SEAL_ASSURANCE_KIT_ROOT"
          if node demo/trace_replay.cjs "$C3_ARTIFACT/trace-transcript.json" \
            --kit "$SEAL_ASSURANCE_KIT_ROOT" --variant quorum-met; then
            echo "::error::quorum-met variant unexpectedly preserved Consensus-deny bytes"
            exit 1
          fi
          if node demo/trace_replay.cjs "$C3_ARTIFACT/trace-transcript.json" \
            --kit "$SEAL_ASSURANCE_KIT_ROOT" --drop-sequence 2; then
            echo "::error::dropping DEPLOY-OK unexpectedly preserved Linear-deny bytes"
            exit 1
          fi
          python3 - "$RUNNER_TEMP/golden-path-c3.txt" <<'PY'
          import sys
          lines = [line for line in open(sys.argv[1], encoding="utf-8")
                   if line.startswith(("\x1b[31;1mDENY\x1b[0m", "\x1b[32;1mALLOW\x1b[0m"))]
          assert len(lines) == 3, lines
          assert lines[0].startswith("\x1b[31;1mDENY\x1b[0m QUORUM-SHORT  deploy"), lines[0]
          assert lines[1].startswith("\x1b[32;1mALLOW\x1b[0m DEPLOY-OK  deploy"), lines[1]
          assert lines[2].startswith("\x1b[31;1mDENY\x1b[0m REPLAY-DENY  deploy"), lines[2]
          PY
          grep -F "kernel_fired=safety:ALLOW[ACTIVE], temporal:ALLOW[ABSENT/OFF], consensus:DENY[ACTIVE], linear:ALLOW[ACTIVE]; deny_kernel=consensus" "$RUNNER_TEMP/golden-path-c3.txt"
          grep -F "kernel_fired=safety:ALLOW[ACTIVE], temporal:ALLOW[ABSENT/OFF], consensus:ALLOW[ACTIVE], linear:ALLOW[ACTIVE]; deny_kernel=-" "$RUNNER_TEMP/golden-path-c3.txt"
          grep -F "kernel_fired=safety:ALLOW[ACTIVE], temporal:ALLOW[ABSENT/OFF], consensus:ALLOW[ACTIVE], linear:DENY[ACTIVE]; deny_kernel=linear" "$RUNNER_TEMP/golden-path-c3.txt"
          grep -F "consensus=tool-name:deploy votes=1/3 required=2 quorum=short" "$RUNNER_TEMP/golden-path-c3.txt"
          grep -F "linear=deploy-cap-c3-001 capArg=capability.id committed=1→1 consumed=false" "$RUNNER_TEMP/golden-path-c3.txt"
          grep -F "linear=deploy-cap-c3-001 capArg=capability.id committed=1→0 consumed=true" "$RUNNER_TEMP/golden-path-c3.txt"
          grep -F "linear=deploy-cap-c3-001 capArg=capability.id committed=0→0 consumed=false" "$RUNNER_TEMP/golden-path-c3.txt"
          test "$(grep -c 'seal-verify=TRACE-SCOPED' "$RUNNER_TEMP/golden-path-c3.txt")" -eq 3
          grep -F "TRACE-CONTROL quorum-met expected=FAIL observed=FAIL status=PASS" "$RUNNER_TEMP/golden-path-c3.txt"
          grep -F "TRACE-CONTROL drop-deploy-ok expected=FAIL observed=FAIL status=PASS" "$RUNNER_TEMP/golden-path-c3.txt"
          grep -F "TRACE-CONTROL byte-flip expected=FAIL observed=FAIL status=PASS" "$RUNNER_TEMP/golden-path-c3.txt"
          grep -F "TRACE-CONTROL restore expected=SHA-MATCH+PASS observed=SHA-MATCH+PASS status=PASS" "$RUNNER_TEMP/golden-path-c3.txt"
          grep -F "deploy executed exactly once; capability 1->0" "$RUNNER_TEMP/golden-path-c3.txt"
          grep -F "PASS doctrine trace" "$RUNNER_TEMP/golden-path-c3.txt"

      - name: Deterministic replicated-store S+V convergence acceptance (no model, no operator auth)
        run: |
          C5_ARTIFACT="$RUNNER_TEMP/seal-doctrine-c5"
          ./demo/run c5 --output-dir "$C5_ARTIFACT" --color always | tee "$RUNNER_TEMP/golden-path-c5.txt"
          python3 demo/doctrine_check.py "$C5_ARTIFACT"
          python3 demo/render_trace.py "$C5_ARTIFACT/events.ndjson" \
            --format markdown --output "$C5_ARTIFACT/receipt-strip.regenerated.md"
          cmp "$C5_ARTIFACT/receipt-strip.md" "$C5_ARTIFACT/receipt-strip.regenerated.md"
          node demo/trace_replay.cjs "$C5_ARTIFACT/trace-transcript.json" \
            --kit "$SEAL_ASSURANCE_KIT_ROOT"
          if node demo/trace_replay.cjs "$C5_ARTIFACT/trace-transcript.json" \
            --kit "$SEAL_ASSURANCE_KIT_ROOT" --drop-trigger; then
            echo "::error::dropping the C5 first call unexpectedly preserved transcript bytes"
            exit 1
          fi
          python3 - "$RUNNER_TEMP/golden-path-c5.txt" <<'PY'
          import sys
          lines = [line for line in open(sys.argv[1], encoding="utf-8")
                   if line.startswith(("\x1b[31;1mDENY\x1b[0m", "\x1b[32;1mALLOW\x1b[0m"))]
          assert len(lines) == 2, lines
          assert lines[0].startswith("\x1b[32;1mALLOW\x1b[0m LEGIT-TRIGGER  store.update"), lines[0]
          assert lines[1].startswith("\x1b[31;1mDENY\x1b[0m ATTACK-DENY  store.update"), lines[1]
          PY
          grep -F "kernel_fired=safety:ALLOW[ACTIVE], temporal:ALLOW[ABSENT/OFF], convergence:ALLOW[ACTIVE]; deny_kernel=-" "$RUNNER_TEMP/golden-path-c5.txt"
          grep -F "kernel_fired=safety:ALLOW[ACTIVE], temporal:ALLOW[ABSENT/OFF], convergence:DENY[ACTIVE]; deny_kernel=convergence" "$RUNNER_TEMP/golden-path-c5.txt"
          grep -F "convergence=orset.add opArg=op in-proven-set=true stateful=false" "$RUNNER_TEMP/golden-path-c5.txt"
          grep -F "convergence=assign opArg=op in-proven-set=false stateful=false" "$RUNNER_TEMP/golden-path-c5.txt"
          grep -F "approved orset.add ALLOW; downstream store.update execution exactly once" "$RUNNER_TEMP/golden-path-c5.txt"
          grep -F "separately approved assign DENY by Convergence; downstream execution zero" "$RUNNER_TEMP/golden-path-c5.txt"
          grep -F "seal-verify=PASS" "$RUNNER_TEMP/golden-path-c5.txt"
          grep -F "seal-verify=TRACE-SCOPED" "$RUNNER_TEMP/golden-path-c5.txt"
          grep -F "plain seal verify re-derives BLOCK but fails byte identity: fresh Temporal trace differs from live step 2" "$RUNNER_TEMP/golden-path-c5.txt"
          grep -F "TRACE-REPLAY PASS" "$RUNNER_TEMP/golden-path-c5.txt"
          grep -F "TRACE-CONTROL drop-trigger expected=BYTE-MISMATCH observed=BYTE-MISMATCH status=PASS" "$RUNNER_TEMP/golden-path-c5.txt"
          grep -F "TRACE-CONTROL byte-flip expected=FAIL observed=FAIL status=PASS" "$RUNNER_TEMP/golden-path-c5.txt"
          grep -F "TRACE-CONTROL restore expected=SHA-MATCH+PASS observed=SHA-MATCH+PASS status=PASS" "$RUNNER_TEMP/golden-path-c5.txt"
          grep -F "ANTI-FORGE rejected exit=" "$RUNNER_TEMP/golden-path-c5.txt"
          grep -F "restore-byte-exact=true" "$RUNNER_TEMP/golden-path-c5.txt"
          grep -F "PASS doctrine trace" "$RUNNER_TEMP/golden-path-c5.txt"

      - name: Deterministic trigger-driven S+T freeze acceptance (no model, no operator auth)
        run: |
          C6_ARTIFACT="$RUNNER_TEMP/seal-doctrine-c6"
          ./demo/run c6 --output-dir "$C6_ARTIFACT" --color always | tee "$RUNNER_TEMP/golden-path-c6.txt"
          python3 demo/doctrine_check.py "$C6_ARTIFACT"
          python3 demo/render_trace.py "$C6_ARTIFACT/events.ndjson" \
            --format markdown --output "$C6_ARTIFACT/receipt-strip.regenerated.md"
          cmp "$C6_ARTIFACT/receipt-strip.md" "$C6_ARTIFACT/receipt-strip.regenerated.md"
          node demo/trace_replay.cjs "$C6_ARTIFACT/trace-transcript.json" \
            --kit "$SEAL_ASSURANCE_KIT_ROOT"
          if node demo/trace_replay.cjs "$C6_ARTIFACT/trace-transcript.json" \
            --kit "$SEAL_ASSURANCE_KIT_ROOT" --drop-trigger; then
            echo "::error::dropping the Temporal trigger unexpectedly preserved transcript bytes"
            exit 1
          fi
          python3 - "$RUNNER_TEMP/golden-path-c6.txt" <<'PY'
          import sys
          lines = [line for line in open(sys.argv[1], encoding="utf-8")
                   if line.startswith(("\x1b[31;1mDENY\x1b[0m", "\x1b[32;1mALLOW\x1b[0m"))]
          assert len(lines) == 2, lines
          assert lines[0].startswith("\x1b[32;1mALLOW\x1b[0m LEGIT-TRIGGER  session.revoke"), lines[0]
          assert lines[1].startswith("\x1b[31;1mDENY\x1b[0m ATTACK-DENY  audit.destroy"), lines[1]
          PY
          grep -F "kernel_fired=safety:ALLOW[ACTIVE], temporal:ALLOW[ACTIVE]; deny_kernel=-" "$RUNNER_TEMP/golden-path-c6.txt"
          grep -F "kernel_fired=safety:ALLOW[ACTIVE], temporal:DENY[ACTIVE]; deny_kernel=temporal" "$RUNNER_TEMP/golden-path-c6.txt"
          grep -F "temporal=freeze-destructive-after-trigger type=no_after trigger={session.revoke,audit.destroy} forbidden={session.revoke,audit.destroy}" "$RUNNER_TEMP/golden-path-c6.txt"
          grep -F "temporal-trace=0→1 evidence=runtime-certificate:trace ok (1 events)" "$RUNNER_TEMP/golden-path-c6.txt"
          grep -F "temporal-trace=1→1 evidence=theorem:Host.registry_deny_temporal_frozen" "$RUNNER_TEMP/golden-path-c6.txt"
          grep -F "capability-consumed=false[Host.registry_deny_no_capability_consumed]" "$RUNNER_TEMP/golden-path-c6.txt"
          grep -F "approved session.revoke ALLOW; downstream execution exactly once" "$RUNNER_TEMP/golden-path-c6.txt"
          grep -F "approved audit.destroy DENY by Temporal; trace theorem-backed unchanged at 1; downstream execution zero" "$RUNNER_TEMP/golden-path-c6.txt"
          grep -F "wall-clock-claim=false" "$RUNNER_TEMP/golden-path-c6.txt"
          grep -F "seal-verify=PASS" "$RUNNER_TEMP/golden-path-c6.txt"
          grep -F "seal-verify=TRACE-SCOPED" "$RUNNER_TEMP/golden-path-c6.txt"
          grep -F "plain seal verify fails honestly: fresh-state ALLOW differs from live-session BLOCK" "$RUNNER_TEMP/golden-path-c6.txt"
          grep -F "TRACE-REPLAY PASS" "$RUNNER_TEMP/golden-path-c6.txt"
          grep -F "TRACE-CONTROL drop-trigger expected=FAIL observed=FAIL status=PASS" "$RUNNER_TEMP/golden-path-c6.txt"
          grep -F "TRACE-CONTROL byte-flip expected=FAIL observed=FAIL status=PASS" "$RUNNER_TEMP/golden-path-c6.txt"
          grep -F "TRACE-CONTROL restore expected=SHA-MATCH+PASS observed=SHA-MATCH+PASS status=PASS" "$RUNNER_TEMP/golden-path-c6.txt"
          grep -F "ANTI-FORGE rejected exit=" "$RUNNER_TEMP/golden-path-c6.txt"
          grep -F "restore-byte-exact=true" "$RUNNER_TEMP/golden-path-c6.txt"
          grep -F "PASS doctrine trace" "$RUNNER_TEMP/golden-path-c6.txt"

      - name: Deterministic filesystem S+B acceptance (no model, no operator auth)
        run: |
          python3 demo/golden_path.py filesystem --deterministic | tee /tmp/golden-path-filesystem.txt
          grep -F "containment preflight" /tmp/golden-path-filesystem.txt
          grep -F "only /workspace writable" /tmp/golden-path-filesystem.txt
          grep -F "init + add-kernel B policy" /tmp/golden-path-filesystem.txt
          grep -F "ACTIVE {S,B}" /tmp/golden-path-filesystem.txt
          grep -F "secure-default signed config" /tmp/golden-path-filesystem.txt
          grep -F "no mode flag in seal-host-rs argv; signed config passed preflight; child marker observed" /tmp/golden-path-filesystem.txt
          grep -F "secure-default tamper denial" /tmp/golden-path-filesystem.txt
          grep -F "trusted config rejected; child marker absent" /tmp/golden-path-filesystem.txt
          grep -F "benign read flows" /tmp/golden-path-filesystem.txt
          grep -F "policy tamper fail-closed" /tmp/golden-path-filesystem.txt
          grep -F "approval tamper fail-closed" /tmp/golden-path-filesystem.txt
          grep -F "path escape rejection" /tmp/golden-path-filesystem.txt
          grep -F "PATH_REJECTED both before filesystem access" /tmp/golden-path-filesystem.txt
          grep -F "approved one-shot real write" /tmp/golden-path-filesystem.txt
          grep -F "replayed_nonce BLOCK" /tmp/golden-path-filesystem.txt
          grep -F "accumulated Budget cap" /tmp/golden-path-filesystem.txt
          grep -F "Budget stateful evidence" /tmp/golden-path-filesystem.txt
          grep -F "fresh write receipt verification" /tmp/golden-path-filesystem.txt
          grep -F "seal scan composition" /tmp/golden-path-filesystem.txt
          grep -F "Budget enforcement is machine-checked by composed_budget_cap" /tmp/golden-path-filesystem.txt
          grep -F "receipt not called independently verified" /tmp/golden-path-filesystem.txt
          grep -F "dev-box deterministic-tested (local run); CI configured but not run; operator-verified: NO" /tmp/golden-path-filesystem.txt
          grep -F "operator-untested until run by Ben" /tmp/golden-path-filesystem.txt

      - name: Preserve doctrine traces, manifests, receipts, and renderings (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctrine-c1-c2-c3-c4-c5-c6-${{ github.sha }}
          path: |
            ${{ runner.temp }}/seal-doctrine-c1
            ${{ runner.temp }}/seal-doctrine-c2
            ${{ runner.temp }}/seal-doctrine-c3
            ${{ runner.temp }}/seal-doctrine-c4
            ${{ runner.temp }}/seal-doctrine-c5
            ${{ runner.temp }}/seal-doctrine-c6
