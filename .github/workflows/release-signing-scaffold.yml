# SPDX-License-Identifier: Apache-2.0

name: Release Signing Scaffold

on:
  workflow_dispatch:
    inputs:
      release_label:
        description: "Human release label for the unsigned scaffold manifest"
        required: true
        type: string
      acknowledge_unsigned_scaffold:
        description: "Type UNSIGNED-SCAFFOLD; this workflow does not sign artifacts"
        required: true
        type: string

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Require unsigned-scaffold acknowledgement
        env:
          ACK: ${{ inputs.acknowledge_unsigned_scaffold }}
        run: test "$ACK" = "UNSIGNED-SCAFFOLD"

      - name: Prepare unsigned release-signing scaffold
        env:
          RELEASE_LABEL: ${{ inputs.release_label }}
        run: |
          set -euo pipefail
          out="release-signing-scaffold"
          mkdir -p "$out"
          {
            printf 'release_label=%s\n' "$RELEASE_LABEL"
            printf 'source_commit=%s\n' "$(git rev-parse HEAD)"
            printf 'workflow=%s\n' "$GITHUB_WORKFLOW"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'signing_status=unsigned_scaffold\n'
          } > "$out/manifest.txt"
          sha256sum \
            lean-toolchain \
            lakefile.toml \
            lake-manifest.json \
            rust/Cargo.toml \
            rust/Cargo.lock \
            .github/workflows/ci.yml \
            > "$out/source-inputs.sha256"
          cat > "$out/FUTURE-COSIGN-KEYLESS.txt" <<'EOF'
This scaffold does not sign artifacts.

Future GitHub Actions keyless signing requires:
- permissions: id-token: write
- a reviewed workflow identity allowed by release policy
- a concrete artifact list generated by the release build

Future command shape:
cosign sign-blob --yes --bundle <artifact>.sigstore.json <artifact>
cosign verify-blob --bundle <artifact>.sigstore.json <artifact> \
  --certificate-identity <expected workflow identity> \
  --certificate-oidc-issuer https://token.actions.githubusercontent.com
EOF

      - uses: actions/upload-artifact@v4
        with:
          name: release-signing-scaffold
          path: release-signing-scaffold/
