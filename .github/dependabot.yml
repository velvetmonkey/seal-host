version: 2
updates:
  - package-ecosystem: cargo
    directory: /rust
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /rust/fuzz
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /deploy/container
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
