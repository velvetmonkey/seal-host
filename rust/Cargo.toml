[package]
name = "seal-host-rs"
version = "0.1.6"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
hex = "0.4"
sha2 = "0.10"
base64 = "0.22"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
libc = "0.2"
jsonschema = "0.49.2"

[dev-dependencies]
proptest = "1"

[lib]
name = "seal_host_rs"
path = "src/lib.rs"

[[bin]]
name = "seal-host-rs"
path = "src/main.rs"

[[bin]]
name = "seal-reachability-report"
path = "src/bin/seal_reachability_report.rs"
