[package]
name = "seal-host-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ed25519-dalek = "3"
hex = "0.4"
sha2 = "0.10"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
libc = "0.2"
jsonschema = "0.48.1"

[dev-dependencies]
proptest = "1"

[lib]
name = "seal_host_rs"
path = "src/lib.rs"

[[bin]]
name = "seal-host-rs"
path = "src/main.rs"
