name = "seal-host"
version = "0.1.0"
defaultTargets = ["seal-host", "axiom_check"]

# Mathlib-carrying libraries first so mathlib's transitive pins win resolution order.
[[require]]
name = "crdt-lean"
git = "https://github.com/velvetmonkey/crdt-lean.git"
rev = "7d9016164c7b9208b93bbb1eef2f5c018d626a32"

[[require]]
name = "temporal-logic-lean"
git = "https://github.com/velvetmonkey/temporal-logic-lean.git"
rev = "6e1cb65409f11c3edebbfd937f56175787774583"

[[require]]
name = "consensus-lean"
git = "https://github.com/velvetmonkey/consensus-lean.git"
rev = "6b300f00ab98660dc87a363c087ed8114fd36206"

[[require]]
name = "calibration-lean"
git = "https://github.com/velvetmonkey/calibration-lean.git"
rev = "804c9a6c49400de779a39a5aca00407bd96c46f4"

[[require]]
name = "mcp-seal"
git = "https://github.com/velvetmonkey/mcp-seal.git"
rev = "c578b5dc8d9c55742eedf07d68f131b0d59db530"

[[lean_lib]]
name = "Host"

[[lean_lib]]
name = "Kernels"

[[lean_lib]]
name = "Test"
globs = ["Test.+"]

[[lean_exe]]
name = "seal-host"
root = "Host.Main"

[[lean_exe]]
name = "axiom_check"
root = "Test.Axioms"

[[lean_exe]]
name = "host_unit_tests"
root = "Test.HostUnit"
